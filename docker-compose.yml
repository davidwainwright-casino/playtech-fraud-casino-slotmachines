services:
  app:
    build: .
    working_dir: /workspace
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: casino_demo
      DB_USERNAME: casino
      DB_PASSWORD: casino
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_started }
  database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: casino_demo
      MYSQL_USER: casino
      MYSQL_PASSWORD: casino
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["casino-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  casino-db:
