<!doctype html>
<html lang="en">
<head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Local Demo Slot</title><style>body{font:18px system-ui;margin:0;background:#111;color:#eee}main{max-width:520px;margin:auto;padding:24px}button,input{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#2d8cff;color:#fff;border:0;border-radius:8px}.card{background:#222;border-radius:12px;padding:18px;margin:14px 0}.muted{color:#aaa}#result{white-space:pre-wrap;color:#9fda9f}</style></head>
<body><main><h1>Local Demo Slot</h1><p class="muted">Trial game with fake funds only.</p><div class="card"><label>Player ID</label><input id="player" value="phone-player"><button id="open">Open game</button></div><div id="game" class="card" hidden><p id="status"></p><p>Balance: <strong id="balance">-</strong></p><label>Bet</label><input id="bet" type="number" min="0" value="100"><button id="init">Initialize</button><button id="spin">Spin</button><pre id="result"></pre></div></main><script>let token;const $=id=>document.getElementById(id);async function call(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const j=await r.json();if(!r.ok)throw Error(j.message||JSON.stringify(j));return j}function show(j){$('result').textContent=JSON.stringify(j,null,2);if(j.balance!==undefined)$('balance').textContent=j.balance}$('open').onclick=async()=>{try{const j=await call('/api/demo/sessions',{method:'POST',body:JSON.stringify({game_id:'local-deterministic-slot',player_id:$('player').value,currency:'USD'})});token=j.token;$('game').hidden=false;$('status').textContent='Session '+token+' ready';show(j)}catch(e){alert(e.message)}};async function event(name){try{show(await call('/api/demo/sessions/'+token+'/events',{method:'POST',body:JSON.stringify({event:name,bet:Number($('bet').value)})}))}catch(e){alert(e.message)}}$('init').onclick=()=>event('init');$('spin').onclick=()=>event('spin');</script></body></html>
